# RetapAstarPlanner parameter definition.
#
# The top-level key must equal the name passed to FINENAV_REGISTER_PLANNER
# ("retap_astar_planner").  It is also the parameter prefix
# generate_parameter_library declares under, so YAML nests one level deeper:
#
#   <engine_node>/<layer_name>:
#     ros__parameters:
#       retap_astar_planner:
#         heuristic_weight: 0.5
#
# The three weights are ReTAP's Astar constructor arguments, in the upstream
# order: (h_w, t_w, g_w) = (heuristic, traversability, distance).
retap_astar_planner:
  heuristic_weight:
    type: double
    default_value: 0.5
    description: "Weight of the Chebyshev heuristic inside F (upstream astar_hueristic_weight)."
  traversability_weight:
    type: double
    default_value: 0.5
    description: "Weight of the accumulated traversability cost (upstream astar_traversability_weight)."
  distance_weight:
    type: double
    default_value: 1.0
    description: "Weight of path length (upstream astar_distance_weight)."

  # ── budgets: the search runs inside FineNav's map read lock ─────────────
  max_expansions:
    type: int
    default_value: 500000
    description: "Hard cap on expanded nodes; 0 = unlimited."
  time_budget_ms:
    type: double
    default_value: 500.0
    description: "Wall-clock cap on one search (ms); 0 = unlimited."

  # ── start/goal handling (upstream GlobalPlanning semantics) ─────────────
  goal_z_tolerance_voxels:
    type: int
    default_value: 2
    description: "Goal is reached when |z - goal_z| <= this many voxels (upstream hard-coded 2)."
  stop_distance:
    type: double
    default_value: 0.2
    description: "Snapped goal closer than this to the robot ends the episode with a one-pose path."
  snap_radius:
    type: double
    default_value: 1.0
    description: "Radius searched for the nearest drivable voxel to the robot and to the goal."

  # ── replan throttle ─────────────────────────────────────────────────────
  # Upstream GlobalPlanning recomputed the path only when the robot had moved
  # 0.2 m from the last planning point or 2 s had elapsed.  Under a periodic
  # policy plan() is called every cycle, so the same gate keeps an unchanged
  # search from re-taking the map read lock.
  replan_min_distance:
    type: double
    default_value: 0.2
    description: "Replan once the robot has moved this far from the last planning point (m)."
    validation:
      gt_eq<>: [0.0]
  replan_period_sec:
    type: double
    default_value: 2.0
    description: "Replan at least this often, even if nothing changed (s); 0 = only on the other triggers."
    validation:
      gt_eq<>: [0.0]
  replan_min_interval_sec:
    type: double
    default_value: 0.5
    description: "Minimum spacing between two replans caused by a map change (s), so a 10 Hz terrain update does not become a 10 Hz search."
    validation:
      gt_eq<>: [0.0]
  replan_on_map_change:
    type: bool
    default_value: false
    description: "Also replan when the map's terrain generation changes (online mapping). Off for a static prior."

  # ── diagnostics ─────────────────────────────────────────────────────────
  verbose:
    type: bool
    default_value: false
    description: "Re-enable ReTAP's per-node stdout diagnostics."
  publish_path:
    type: bool
    default_value: true
    description: "Publish the path as a MarkerArray on /retap/path."
