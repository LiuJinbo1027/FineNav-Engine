# ==============================================================================
#  res 0.05 + ring 49：高分辨率实验（4× 于 0.20，代价约 16–64×）
# ==============================================================================
#  目的：看同一份 rosbag 在 5 cm 体素下，地形属性（坡度/粗糙度/稀疏度）和
#        碰撞判定还剩多少信息量。**不是**推荐配置，是实验配置。
#
#  几何（60×60×60 cm 机器人）：
#    水平：ring 49 = 1 + 8×6 → R = 6，外沿 6.5 × 0.05 = 0.325 m
#          （0.20 + ring 9 是 0.30 m，同一量级，这是刻意对齐的）
#          规则：(2R+1) × res ≥ 0.60 m 机体宽度 → 13 × 0.05 = 0.65 m ✓
#    竖直：clearance_voxels = 0.60/0.05 + 1 = 13
#          z=+1..+12 = 机体 0.60 m（只受地形约束），z=+13 = 硬阻挡层
#    向下：support_voxels = 3（z=0..-3 共 4 层），与其它配置一致
#
#  预期会暴露的问题（跑完对照 stats 看）：
#    1. 点密度：同一帧 0.20 m 下中位 7 点/体素，0.05 m 下按体积折算约
#       7/64 ≈ 0.1 —— 绝大多数体素只有 1 个点。于是
#         · sparsity ≈ 1（density 的分母 points_number_threshold 是 20）；
#         · 法向量退回到“用栅格中心算 SVD”的分支（点数 ≤ 栅格数）；
#         · roughness / slope 变成噪声的函数而不是地形的函数。
#    2. 邻居搜索：一次 checkNeighborCells 最多 121 偏移 × 17 层 ≈ 2k 次
#       八叉树查询/体素，体素数又是 0.20 m 的十几倍 → 分析时间会到分钟级。
#    3. 硬阻挡层从 0.20 m 的 z=+4（0.90 m 高）变成 z=+13（0.68 m 高）：
#       同一个机体高度，不同分辨率下对应的物理高度终于一致了，这正是
#       clearance_voxels 参数化的意义。
#
#  min_voxel_points 保持 0（不启用）：本配置想先看“什么都不加”的高分辨率
#  结果，N 的效果在同一份配置上把 N 改 3/5/10 再跑即可。
# ==============================================================================
retap_terrain:
  resolution: 0.05

  slope_threshold: 0.65
  roughness_threshold: 0.50
  sparsity_threshold: 0.70
  traversability_threshold: 0.805

  slope_weight: 0.5
  roughness_weight: 0.3
  sparsity_weight: 0.2
  traversability_weight: 2.3

  points_number_threshold: 20
  collision_neighbor: 49          # R=6 → 13×13 体素 = 0.65 m，覆盖 0.60 m 机体
  clearance_voxels: 13            # 0.60/0.05 = 12 层机体 + 1 层硬顶
  support_voxels: 3
  min_voxel_points: 0
  frame_height: 0.5
  filling_radius: 0.5
