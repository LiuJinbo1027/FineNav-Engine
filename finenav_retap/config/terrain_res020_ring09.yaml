# ==============================================================================
#  res 0.20 + ring 9：水平膨胀对齐 60 cm 足迹（推荐先跑的一套）
# ==============================================================================
#  与 baseline 的**唯一**差别是 collision_neighbor: 17 → 9。
#
#    水平：ring 9 → 外沿 1.5 × 0.2 = 0.30 m ＝ 机器人半宽，零余量
#    竖直：3 层 × 0.2 = 0.60 m ＝ 机器人高度（不变）
#
#  实测（同一份 24.47 m 轨迹、90 个轨迹格）：
#    轨迹格可通行    20/90 = 22%  →  37/90 = 41%
#    地板上表面列     46/1655 = 2.8% →  88/1655 = 5.3%
#  内存/耗时/点密度全部不变（占据体素数仍为 28871，中位 7 点/体素）。
#
#  代价：只有 8 个水平方向（+自身），对角方向上的细杆可能从两个格子的缝隙
#        漏过；0.20 m 的格子本身也分辨不出 10 cm 的杆，所以这一代价目前
#        不构成实际损失。若将来要留 0.1 m 安全余量，用 0.12 + ring 17 + 净空
#        5 层，效果相同但代价 3 倍。
# ==============================================================================
retap_terrain:
  resolution: 0.2

  slope_threshold: 0.65
  roughness_threshold: 0.50
  sparsity_threshold: 0.70
  traversability_threshold: 0.805

  slope_weight: 0.5
  roughness_weight: 0.3
  sparsity_weight: 0.2
  traversability_weight: 2.3

  points_number_threshold: 20
  collision_neighbor: 9           # ← 唯一改动：17 → 9（R2 → R1）
  clearance_voxels: 4             # z=+4 有占据即碰撞；z=1..3 只查地形约束
  support_voxels: 3               # 向下 z=0..-3 共 4 层；z=-2/-3 是支撑判据
  min_voxel_points: 0             # N（证据阈值）：0 = 不启用
  frame_height: 0.5
  filling_radius: 0.5
