# ==============================================================================
#  retap_demo — S5 parameter file: online incremental mapping in Gazebo
# ==============================================================================
#  Usage (from demo/launch/retap_s5_sim.launch.py, which also starts Gazebo):
#    ros2 launch finenav_retap retap_s5_sim.launch.py
#
#  What is different from retap_demo.yaml (S4):
#    - the prior map is exported from the Gazebo world itself (the map_desert
#      mesh together with its SDF <scale>), so the terrain the planner renders
#      is the terrain the lidar scans.  The launch file rebuilds it when
#      missing;
#    - online_mapping: true, update_free: 2 (1 m of free space behind each
#      hit, as ReTAP's global map), max_range 7.0 = the simulated lidar's.
#      Live scans are merged into the prior, so the tree grows with what the
#      robot actually sees -- including obstacles that were not mapped before;
#    - the planner runs under PeriodicPolicy: the map grows under the robot,
#      so a new search is triggered by the replan throttle
#      (replan_on_map_change / replan_min_distance / replan_period_sec);
#    - the localizer takes Gazebo's ground-truth /odom.  The simulator's helper
#      node publishes an identity map->odom, so the odometry pose IS the map
#      pose and no initial pose is needed.
#
#  Node naming: every private node is created as <engine_node_name>/<name>:
#      /retap_demo/retap_terrain_map   MapServer
#      /retap_demo/retap_layer         ControlLayer (planner + world view)
#      /retap_demo/finenav_navigator   BtNavigator
#      /retap_demo/finenav_localizer   FineNavLocalizer
# ==============================================================================

# ── engine ─────────────────────────────────────────────────────────────────
# Declared by retap_demo's main() on the engine node itself.
/retap_demo:
  ros__parameters:
    use_sim_time: true
    planner_policy: periodic   # event | periodic

# ── terrain map (online incremental) ───────────────────────────────────────
/retap_demo/retap_terrain_map:
  ros__parameters:
    use_sim_time: true
    # The lidar runs at 10 Hz; the update cycle must keep up so the scan
    # queue never backs up.
    update_rate_hz: 10.0

    retap_terrain_map:
      # ── static prior: the same Gazebo terrain the lidar sees ────────────
      # Generated by demo/launch/retap_s5_sim.launch.py when missing:
      #   export_gazebo_pcd  (map_desert mesh -> world-frame .pcd)
      #   retap_map_tool analyze  (.pcd -> terrain .bt)
      # The mesh, the SDF <scale> and the export live in the simulator
      # package; see retap_ros2/scripts/export_gazebo_pcd.py for why the
      # simulator's own desert.pcd is NOT the same surface (it is half the
      # size and unshifted, so mixing it in creates a second ground layer).
      # Online scans are then merged into this prior: they must coincide with
      # it (measured: median 2 cm, p90 3.4 cm).
      map_format: bt
      map_path: "/tmp/retap_gazebo/map_desert_world_terrain.bt"
      resolution: 0.2

      # ── terrain analysis: same calibration as S4 / terrain_sim.yaml ──────
      slope_threshold: 0.65
      roughness_threshold: 0.50
      sparsity_threshold: 0.70
      traversability_threshold: 0.805
      slope_weight: 0.5
      roughness_weight: 0.3
      sparsity_weight: 0.2
      traversability_weight: 2.3
      points_number_threshold: 20
      collision_neighbor: 17
      frame_height: 0.5
      filling_radius: 0.5

      # ── diagnostics ──────────────────────────────────────────────────────
      publish_diagnostics: true
      downsample_diagnostics: 1
      diagnostics_period_sec: 1.0

      # ── online incremental mapping (S5) ──────────────────────────────────
      online_mapping: true
      scan_topic: /cloud_registered     # produced by the launch file, map frame
      scan_in_map_frame: true           # no TF lookup inside the map plugin
      update_free: 2                    # ReTAP's online global-map policy
      max_range: 7.0                    # simulated lidar range
      # The ray origin is the sensor, not base_link.  The simulated gpu_lidar
      # sits at (0.192, 0, -0.302) in base_link (mount x 0.16 + 0.045 along a
      # 45 deg slope).  Rotated by the robot's yaw at ray-casting time.
      origin_offset_x: 0.192
      origin_offset_y: 0.0
      origin_offset_z: -0.302
      max_buffer_size: 2
      max_scans_per_cycle: 4
      terrain_update_batch: 3
      terrain_update_period_sec: 0.5

# ── planner + world view (one ControlLayer) ─────────────────────────────────
/retap_demo/retap_layer:
  ros__parameters:
    use_sim_time: true
    # Read by PeriodicPolicy::declare_parameters() on this node.  2 Hz: the
    # terrain is re-analysed in batches every ~0.4 s, so a faster loop would
    # only republish the same path (and log the pose-only-trajectory warning
    # that often).
    frequency_hz: 2.0

    retap_astar_planner:
      heuristic_weight: 0.5
      traversability_weight: 0.5
      distance_weight: 1.0
      max_expansions: 500000
      time_budget_ms: 500.0
      goal_z_tolerance_voxels: 2
      stop_distance: 0.2
      # 1.5 m, not the static demo's 1.0: while the map is built online the
      # ground directly under the robot is self-occluded (and the sensor's own
      # body is self-filtered), so the nearest drivable voxel can sit ~1 m
      # away on rough terrain.  Measured in Gazebo: nearest drivable 0.48 m,
      # nearest collision 0.08 m around the robot.
      snap_radius: 1.5
      verbose: false
      publish_path: true

      # ── replan throttle (upstream GlobalPlanning: 0.2 m / 2 s) ───────────
      replan_min_distance: 0.2
      replan_period_sec: 2.0
      # At most one map-change-triggered search every 0.5 s, even though the
      # terrain updates every few cycles.
      replan_min_interval_sec: 0.5
      replan_on_map_change: true

    retap_world_view:
      search_margin: 3.0
      publish_markers: true

# ── navigator (behaviour tree) ──────────────────────────────────────────────
/retap_demo/finenav_navigator:
  ros__parameters:
    use_sim_time: true
    behavior_trees:
      - "finenav_retap/demo/behavior_trees"

# ── localizer: Gazebo ground-truth odometry ────────────────────────────────
# With no world anchor and map->odom identity (published by the simulator's
# helper node), onOdometry() sets the state to the odom pose directly.
/retap_demo/finenav_localizer:
  ros__parameters:
    use_sim_time: true
    pose_topic: ""
    initial_pose_topic: ""
    twist_topic: ""
    odom_topic: "/odom"
    odom_use_twist: true
    force_2d_mode: false
    publish_tf: false
    publish_odom: false
